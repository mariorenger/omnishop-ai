<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OmniShop AI — Dashboard</title>
<style>
  :root{--bg:#0f172a;--panel:#111827;--card:#1f2937;--line:#334155;--fg:#e5e7eb;--muted:#94a3b8;--accent:#6366f1;--ok:#22c55e;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg)}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sp{flex:1}
  select,input,textarea,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{background:var(--accent);border:none;cursor:pointer;font-weight:600}
  button.sec{background:var(--card);border:1px solid var(--line)}
  button:hover{filter:brightness(1.08)}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .tabs button{background:var(--card);border:1px solid var(--line)}
  .tabs button.active{background:var(--accent);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:10px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .pill.ai{color:#a5b4fc}.pill.needs_human{color:var(--warn);border-color:var(--warn)}.pill.human{color:var(--ok)}
  .center{max-width:400px;margin:8vh auto}
  .err{color:#fca5a5;font-size:13px;min-height:18px}
  code{background:#0b1220;padding:2px 6px;border-radius:6px}
  pre{background:#0b1220;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
  .msg{padding:8px 12px;border-radius:10px;margin:6px 0;max-width:80%}
  .msg.customer{background:#0b1220;margin-left:auto}
  .msg.ai{background:#312e81}.msg.agent{background:#14532d}.msg.system{background:#3f2d0b}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "";
let state = { token:null, user:null, orgs:[], org:null, shops:[], shop:null, tab:"products" };

function saveAuth(){ localStorage.setItem("omni", JSON.stringify({token:state.token, org:state.org && state.org.id})); }
function loadAuth(){ try{ return JSON.parse(localStorage.getItem("omni")||"{}"); }catch(e){ return {}; } }

async function api(path, opts={}){
  const h = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(state.token) h["Authorization"] = "Bearer "+state.token;
  if(state.org) h["X-Org-Id"] = state.org.id;
  const res = await fetch(API+path, Object.assign({}, opts, {headers:h}));
  if(!res.ok){ let d; try{d=await res.json();}catch(e){d={detail:res.statusText};} throw new Error(d.detail||("HTTP "+res.status)); }
  return res.status===204 ? null : res.json();
}
const el = (t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="on")for(const ev in a.on)e.addEventListener(ev,a.on[ev]);else if(k==="html")e.innerHTML=a[k];else e.setAttribute(k,a[k]);}c.flat().forEach(x=>e.appendChild(typeof x==="string"?document.createTextNode(x):x));return e;};

// ---------- auth ----------
function authView(){
  const app = document.getElementById("app");
  app.innerHTML="";
  const err = el("div",{class:"err"});
  const email = el("input",{placeholder:"email",value:""});
  const pass = el("input",{type:"password",placeholder:"mật khẩu (≥8)"});
  const org = el("input",{placeholder:"tên workspace (khi đăng ký)"});
  const doLogin=async()=>{ err.textContent=""; try{ const d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})}); afterAuth(d);}catch(e){err.textContent=e.message;} };
  const doSignup=async()=>{ err.textContent=""; try{ const d=await api("/api/auth/signup",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value,org_name:org.value})}); afterAuth(d);}catch(e){err.textContent=e.message;} };
  app.appendChild(el("div",{class:"center"},
    el("div",{class:"card"},
      el("h1",{},"OmniShop AI"),
      el("p",{class:"muted"},"Đăng nhập hoặc tạo tài khoản để bắt đầu."),
      el("label",{},"Email"), email,
      el("label",{},"Mật khẩu"), pass,
      el("label",{},"Workspace (đăng ký mới)"), org,
      el("div",{class:"row",style:"margin-top:12px"}, el("button",{on:{click:doLogin}},"Đăng nhập"), el("button",{class:"sec",on:{click:doSignup}},"Đăng ký")),
      err
    )));
}
function afterAuth(d){ state.token=d.token; state.user=d.user; state.orgs=d.orgs||[]; state.org=state.orgs[0]||null; saveAuth(); boot(); }

// ---------- shell ----------
async function boot(){
  if(!state.token){ authView(); return; }
  try{ const me=await api("/api/auth/me"); state.user=me.user; state.orgs=me.orgs; }
  catch(e){ state.token=null; saveAuth(); authView(); return; }
  const saved=loadAuth();
  state.org = state.orgs.find(o=>o.id===saved.org) || state.orgs[0] || null;
  if(state.org){ try{ state.shops=await api("/api/shops"); }catch(e){ state.shops=[]; } state.shop=state.shops[0]||null; }
  render();
}

function render(){
  const app=document.getElementById("app"); app.innerHTML="";
  const orgSel=el("select",{on:{change:async e=>{state.org=state.orgs.find(o=>o.id===e.target.value);saveAuth();state.shops=await api("/api/shops");state.shop=state.shops[0]||null;render();}}},
    ...state.orgs.map(o=>el("option",{value:o.id,...(state.org&&o.id===state.org.id?{selected:"1"}:{})},o.name)));
  const shopSel=el("select",{on:{change:e=>{state.shop=state.shops.find(s=>s.id===e.target.value);render();}}},
    ...state.shops.map(s=>el("option",{value:s.id,...(state.shop&&s.id===state.shop.id?{selected:"1"}:{})},s.name)),
    ...(state.shops.length?[]:[el("option",{},"(chưa có shop)")]));
  app.appendChild(el("header",{},
    el("h1",{},"🛍️ OmniShop AI"),
    el("span",{class:"muted"},"Org:"), orgSel,
    el("span",{class:"muted"},"Shop:"), shopSel,
    el("span",{class:"sp"}),
    el("span",{class:"muted"}, state.user?state.user.email:""),
    el("button",{class:"sec",on:{click:()=>{state.token=null;saveAuth();authView();}}},"Đăng xuất")));
  const wrap=el("div",{class:"wrap"});
  const tabs=["products","knowledge","channels","inbox","usage","plan"];
  const labels={products:"Sản phẩm",knowledge:"Kiến thức",channels:"Kênh & Widget",inbox:"Hộp thư",usage:"Sử dụng",plan:"Gói"};
  wrap.appendChild(el("div",{class:"tabs"},...tabs.map(t=>el("button",{class:state.tab===t?"active":"",on:{click:()=>{state.tab=t;render();}}},labels[t]))));
  const body=el("div",{id:"body"}); wrap.appendChild(body); app.appendChild(wrap);
  if(!state.shop && state.tab!=="plan"){ body.appendChild(shopSetup()); return; }
  ({products:tabProducts,knowledge:tabKnowledge,channels:tabChannels,inbox:tabInbox,usage:tabUsage,plan:tabPlan}[state.tab])(body);
}

function shopSetup(){
  const name=el("input",{placeholder:"Tên cửa hàng"});
  const err=el("div",{class:"err"});
  return el("div",{class:"card"}, el("h3",{},"Tạo cửa hàng đầu tiên"),
    el("p",{class:"muted"},"Bạn cần một cửa hàng để thêm sản phẩm, kiến thức và bật chatbot."),
    el("label",{},"Tên cửa hàng"), name,
    el("div",{style:"margin-top:10px"}, el("button",{on:{click:async()=>{try{await api("/api/shops",{method:"POST",body:JSON.stringify({name:name.value||"Cửa hàng của tôi"})});state.shops=await api("/api/shops");state.shop=state.shops[0];render();}catch(e){err.textContent=e.message;}}}},"Tạo cửa hàng")), err);
}

// ---------- products ----------
async function tabProducts(body){
  const list=el("div",{},"Đang tải…");
  const name=el("input",{placeholder:"Tên sản phẩm"}), price=el("input",{placeholder:"Giá",type:"number"}), desc=el("textarea",{placeholder:"Mô tả"});
  const variants=el("input",{placeholder:"Biến thể: Size M:10, Size L:3 (tên:tồn kho, phẩy ngăn cách)"});
  const err=el("div",{class:"err"});
  const add=async()=>{ err.textContent="";
    const vs=(variants.value||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>{const [n,st]=s.split(":");return {name:(n||"").trim(),stock:parseInt(st||"0")||0};});
    try{ await api("/api/products",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,name:name.value,price:price.value?parseFloat(price.value):null,description:desc.value,variants:vs})}); name.value="";price.value="";desc.value="";variants.value=""; load(); }catch(e){err.textContent=e.message;} };
  const load=async()=>{ try{ const ps=await api("/api/products?shop_id="+state.shop.id); list.innerHTML="";
    if(!ps.length) list.appendChild(el("p",{class:"muted"},"Chưa có sản phẩm."));
    else{ const t=el("table",{},el("tr",{},el("th",{},"Tên"),el("th",{},"Giá"),el("th",{},"Biến thể")));
      ps.forEach(p=>t.appendChild(el("tr",{},el("td",{},p.name),el("td",{},p.price!=null?(p.price+" "+p.currency):"—"),el("td",{},(p.variants||[]).map(v=>v.name+" ("+v.stock+")").join(", ")||"—"))));
      list.appendChild(t);} }catch(e){list.innerHTML="";list.appendChild(el("div",{class:"err"},e.message));} };
  body.appendChild(el("div",{class:"card"},el("h3",{},"Thêm sản phẩm"),
    el("label",{},"Tên"),name,el("div",{class:"row"},el("div",{},el("label",{},"Giá (VND)"),price)),
    el("label",{},"Mô tả"),desc,el("label",{},"Biến thể / tồn kho"),variants,
    el("div",{style:"margin-top:10px"},el("button",{on:{click:add}},"Lưu sản phẩm")),err));
  body.appendChild(el("div",{class:"card"},el("h3",{},"Sản phẩm"),list)); load();
}

// ---------- knowledge ----------
async function tabKnowledge(body){
  const list=el("div",{},"Đang tải…");
  const title=el("input",{placeholder:"Tiêu đề (vd: Chính sách đổi trả)"}), text=el("textarea",{placeholder:"Dán nội dung kiến thức ở đây…",style:"min-height:120px"});
  const err=el("div",{class:"err"});
  const add=async()=>{err.textContent="";try{await api("/api/knowledge/documents",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,title:title.value,text:text.value})});title.value="";text.value="";load();}catch(e){err.textContent=e.message;}};
  const load=async()=>{try{const ds=await api("/api/knowledge/documents?shop_id="+state.shop.id);list.innerHTML="";
    if(!ds.length)list.appendChild(el("p",{class:"muted"},"Chưa có tài liệu."));
    else{const t=el("table",{},el("tr",{},el("th",{},"Tiêu đề"),el("th",{},"Trạng thái"),el("th",{},"Đoạn")));
      ds.forEach(d=>t.appendChild(el("tr",{},el("td",{},d.title),el("td",{},d.status),el("td",{},String(d.chunks)))));list.appendChild(t);
      if(ds.some(d=>d.status!=="ready")) setTimeout(load,2000);}}catch(e){list.innerHTML="";list.appendChild(el("div",{class:"err"},e.message));}};
  body.appendChild(el("div",{class:"card"},el("h3",{},"Thêm kiến thức"),el("label",{},"Tiêu đề"),title,el("label",{},"Nội dung"),text,
    el("p",{class:"muted"},"Nội dung sẽ được cắt đoạn và tạo embedding (chạy nền)."),
    el("div",{},el("button",{on:{click:add}},"Tải lên")),err));
  body.appendChild(el("div",{class:"card"},el("h3",{},"Tài liệu"),list));load();
}

// ---------- channels ----------
async function tabChannels(body){
  const list=el("div",{},"Đang tải…");
  const err=el("div",{class:"err"});
  const create=async()=>{err.textContent="";try{await api("/api/channels",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,kind:"website",name:"Website widget"})});load();}catch(e){err.textContent=e.message;}};
  const load=async()=>{try{const cs=await api("/api/channels?shop_id="+state.shop.id);list.innerHTML="";
    if(!cs.length)list.appendChild(el("p",{class:"muted"},"Chưa có kênh nào. Tạo widget website để nhúng vào trang của bạn."));
    cs.forEach(c=>{const url=location.origin+"/widget.html?key="+c.public_key;
      const snippet='<iframe src="'+url+'" style="border:0;width:380px;height:560px"></iframe>';
      list.appendChild(el("div",{class:"card"},el("div",{class:"row"},el("strong",{},c.name),el("span",{class:"pill "+c.status},c.status)),
        el("p",{class:"muted"},"Public key: "),el("code",{},c.public_key),
        el("p",{},el("a",{href:url,target:"_blank"},"➜ Mở thử widget")),
        el("label",{},"Mã nhúng"),el("pre",{},snippet)));});
    }catch(e){list.innerHTML="";list.appendChild(el("div",{class:"err"},e.message));}};
  body.appendChild(el("div",{class:"card"},el("h3",{},"Kênh bán hàng"),
    el("p",{class:"muted"},"MVP hỗ trợ Website widget (chạy ngay). Facebook/Instagram/TikTok/Shopee sẽ thêm sau khi qua app-review."),
    el("button",{on:{click:create}},"➕ Tạo Website widget"),err));
  body.appendChild(list);load();
}

// ---------- inbox ----------
async function tabInbox(body){
  const cols=el("div",{class:"row",style:"align-items:flex-start"});
  const left=el("div",{style:"flex:1;min-width:260px"}); const right=el("div",{style:"flex:2;min-width:280px"},el("p",{class:"muted"},"Chọn một hội thoại."));
  cols.appendChild(left);cols.appendChild(right);
  body.appendChild(el("div",{class:"card"},el("h3",{},"Hộp thư hợp nhất"),cols));
  const openConv=async(c)=>{ right.innerHTML="";
    const box=el("div",{style:"max-height:50vh;overflow:auto"});
    const msgs=await api("/api/conversations/"+c.id+"/messages");
    msgs.forEach(m=>box.appendChild(el("div",{class:"msg "+m.role},m.content)));
    const inp=el("input",{placeholder:"Trả lời với tư cách nhân viên…",style:"flex:1"});
    const send=async()=>{if(!inp.value.trim())return;await api("/api/conversations/"+c.id+"/reply",{method:"POST",body:JSON.stringify({text:inp.value})});inp.value="";openConv(c);};
    right.appendChild(el("div",{},el("div",{class:"row"},el("strong",{},"Khách: "+c.customer_ref),el("span",{class:"pill "+c.status},c.status)),
      box, el("div",{class:"row",style:"margin-top:8px"},inp,el("button",{on:{click:send}},"Gửi"),
        el("button",{class:"sec",on:{click:async()=>{await api("/api/conversations/"+c.id+"/close",{method:"POST"});loadList();}}},"Đóng"))));
  };
  const loadList=async()=>{ left.innerHTML=""; const cs=await api("/api/conversations?shop_id="+state.shop.id);
    if(!cs.length)left.appendChild(el("p",{class:"muted"},"Chưa có hội thoại. Thử nhắn qua widget!"));
    cs.forEach(c=>left.appendChild(el("div",{class:"card",style:"cursor:pointer",on:{click:()=>openConv(c)}},
      el("div",{class:"row"},el("strong",{},c.customer_ref),el("span",{class:"pill "+c.status},c.status)),
      el("div",{class:"muted",style:"font-size:13px"},(c.last_message||"").slice(0,80))))); };
  loadList();
}

// ---------- usage ----------
async function tabUsage(body){
  try{ const s=await api("/api/usage/summary"); const sub=await api("/api/subscription");
    body.appendChild(el("div",{class:"card"},el("h3",{},"Sử dụng tháng này"),
      el("table",{},
        el("tr",{},el("td",{},"Tin nhắn AI"),el("td",{},String(s.ai_messages)+" / "+sub.quota.limit)),
        el("tr",{},el("td",{},"Input tokens"),el("td",{},String(s.input_tokens))),
        el("tr",{},el("td",{},"Output tokens"),el("td",{},String(s.output_tokens))),
        el("tr",{},el("td",{},"Embedding tokens"),el("td",{},String(s.embedding_tokens))),
        el("tr",{},el("td",{},"Chi phí ước tính (COGS)"),el("td",{},"$"+s.total_cost.toFixed(4))))));
  }catch(e){body.appendChild(el("div",{class:"err"},e.message));}
}

// ---------- plan ----------
async function tabPlan(body){
  try{ const plans=await api("/api/plans"); const sub=await api("/api/subscription");
    const cur=sub.entitlements._plan;
    body.appendChild(el("div",{class:"card"},el("h3",{},"Gói hiện tại: "+sub.entitlements._plan_name),
      el("p",{class:"muted"},"Quota AI/tháng: "+sub.quota.used+" / "+sub.quota.limit)));
    plans.forEach(p=>{ const e=p.entitlements;
      body.appendChild(el("div",{class:"card"},el("div",{class:"row"},el("strong",{},p.name),el("span",{class:"muted"},"$"+p.price_month+"/tháng"),
        ...(p.code===cur?[el("span",{class:"pill human"},"đang dùng")]:[el("button",{class:"sec",on:{click:async()=>{await api("/api/subscription",{method:"POST",body:JSON.stringify({plan_code:p.code})});render();}}},"Chọn gói này")])),
        el("p",{class:"muted"},"AI/tháng: "+e.ai_messages_month+" · Shops: "+e.shops+" · Kênh: "+(e.channels_allowed||[]).join(", "))));
    });
  }catch(e){body.appendChild(el("div",{class:"err"},e.message));}
}

// ---------- start ----------
(function(){ const s=loadAuth(); if(s.token){ state.token=s.token; } boot(); })();
</script>
</body>
</html>
