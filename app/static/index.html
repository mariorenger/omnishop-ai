<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OmniShop AI — Dashboard</title>
<style>
  :root{
    --bg:#0b1020;--bg2:#0f1629;--panel:#131b33;--card:#182140;--card2:#1e2a52;
    --line:#2a3763;--fg:#eef2ff;--muted:#93a0c8;--accent:#6d7cff;--accent2:#8b5cf6;
    --ok:#34d399;--warn:#fbbf24;--bad:#f87171;--radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;background:
    radial-gradient(1200px 600px at 80% -10%,rgba(109,124,255,.15),transparent),
    radial-gradient(900px 500px at -10% 110%,rgba(139,92,246,.12),transparent),var(--bg);color:var(--fg)}
  a{color:var(--accent);text-decoration:none}
  button,input,select,textarea{font:inherit;color:var(--fg)}
  input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{resize:vertical}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:600;letter-spacing:.02em}
  button{background:linear-gradient(180deg,var(--accent),#5a68e6);border:none;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;transition:.15s;width:auto}
  button:hover{filter:brightness(1.1);transform:translateY(-1px)}
  button.sec{background:var(--card2);border:1px solid var(--line)}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .card h3{margin:0 0 4px;font-size:16px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.top{align-items:flex-start}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .muted{color:var(--muted)}
  .err{color:var(--bad);font-size:13px;min-height:16px;margin-top:8px}
  .okmsg{color:var(--ok);font-size:13px;min-height:16px;margin-top:8px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-weight:600}
  .pill.ai,.pill.connected,.pill.ready,.pill.active{color:#a5b4fc;border-color:#3b4a86}
  .pill.needs_human,.pill.pending,.pill.processing{color:var(--warn);border-color:#5a4a1e}
  .pill.human{color:var(--ok);border-color:#1e5a44}
  .pill.error,.pill.closed{color:var(--bad);border-color:#5a2323}
  code{background:#0a0f20;padding:2px 7px;border-radius:6px;font-size:12px}
  pre{background:#0a0f20;border:1px solid var(--line);padding:12px;border-radius:10px;overflow:auto;font-size:12px}
  .msg{padding:9px 13px;border-radius:12px;margin:6px 0;max-width:82%;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .msg.customer{background:#0a0f20;margin-left:auto;border:1px solid var(--line)}
  .msg.ai{background:linear-gradient(180deg,#31307e,#2a2a63)}
  .msg.agent{background:linear-gradient(180deg,#155e43,#124e39)}
  .msg.system{background:#4a3410;border:1px solid #6b4d18;font-size:13px}
  /* layout */
  #app{min-height:100vh}
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  @media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5}}
  .side{background:linear-gradient(180deg,var(--panel),var(--bg2));border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
  .brand{font-weight:800;font-size:18px;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:600;color:var(--muted);font-size:11px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
  .nav:hover{background:var(--card)}
  .nav.active{background:linear-gradient(90deg,rgba(109,124,255,.25),transparent);color:var(--fg);border:1px solid var(--line)}
  .nav .ic{width:20px;text-align:center}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(15,22,41,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:4}
  .topbar select{width:auto;min-width:140px}
  .content{padding:22px;max-width:960px;width:100%}
  .center{max-width:420px;margin:9vh auto;padding:0 16px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi .b{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:12px;padding:14px}
  .kpi .n{font-size:22px;font-weight:800}.kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .tag{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
  .drop:hover{border-color:var(--accent);color:var(--fg)}
</style>
</head>
<body><div id="app"></div>
<script>
let state={token:null,user:null,orgs:[],org:null,shops:[],shop:null,tab:"products"};
function saveAuth(){localStorage.setItem("omni",JSON.stringify({token:state.token,org:state.org&&state.org.id,tab:state.tab}));}
function loadAuth(){try{return JSON.parse(localStorage.getItem("omni")||"{}");}catch(e){return{};}}
async function api(path,opts={}){
  const h=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(state.token)h["Authorization"]="Bearer "+state.token;
  if(state.org)h["X-Org-Id"]=state.org.id;
  const res=await fetch(path,Object.assign({},opts,{headers:h}));
  if(!res.ok){let d;try{d=await res.json();}catch(e){d={detail:res.statusText};}throw new Error(d.detail||("HTTP "+res.status));}
  return res.status===204?null:res.json();
}
async function apiForm(path,formData){
  const h={};if(state.token)h["Authorization"]="Bearer "+state.token;if(state.org)h["X-Org-Id"]=state.org.id;
  const res=await fetch(path,{method:"POST",headers:h,body:formData});
  if(!res.ok){let d;try{d=await res.json();}catch(e){d={detail:res.statusText};}throw new Error(d.detail||("HTTP "+res.status));}
  return res.json();
}
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="on")for(const ev in a.on)e.addEventListener(ev,a.on[ev]);else if(k==="html")e.innerHTML=a[k];else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]);}c.flat().forEach(x=>{if(x==null||x===false)return;e.appendChild(typeof x==="string"?document.createTextNode(x):x);});return e;};

// ---------- auth ----------
function authView(){

  const err=el("div",{class:"err"});
  const email=el("input",{placeholder:"email"}),pass=el("input",{type:"password",placeholder:"mật khẩu (≥8)"}),org=el("input",{placeholder:"tên workspace (khi đăng ký)"});
  const doLogin=async()=>{err.textContent="";try{afterAuth(await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})}));}catch(e){err.textContent=e.message;}};
  const doSignup=async()=>{err.textContent="";try{afterAuth(await api("/api/auth/signup",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value,org_name:org.value})}));}catch(e){err.textContent=e.message;}};
  app.appendChild(el("div",{class:"center"},el("div",{class:"card"},
    el("div",{class:"brand"},"🛍️ OmniShop AI"),
    el("p",{class:"sub"},"Nền tảng chatbot AI đa kênh cho cửa hàng. Đăng nhập hoặc tạo tài khoản."),
    el("label",{},"Email"),email,el("label",{},"Mật khẩu"),pass,el("label",{},"Workspace (đăng ký mới)"),org,
    el("div",{class:"row",style:"margin-top:14px"},el("button",{on:{click:doLogin}},"Đăng nhập"),el("button",{class:"sec",on:{click:doSignup}},"Đăng ký")),
    err,el("p",{class:"muted",style:"margin-top:14px;font-size:12px"},"Demo: demo@omnishop.local / demo12345"))));
}
function afterAuth(d){state.token=d.token;state.user=d.user;state.orgs=d.orgs||[];state.org=state.orgs[0]||null;saveAuth();boot();}

// ---------- shell ----------
async function boot(){
  if(!state.token){authView();return;}
  try{const me=await api("/api/auth/me");state.user=me.user;state.orgs=me.orgs;}
  catch(e){state.token=null;saveAuth();authView();return;}
  const saved=loadAuth();state.org=state.orgs.find(o=>o.id===saved.org)||state.orgs[0]||null;
  if(saved.tab)state.tab=saved.tab;
  if(state.org){try{state.shops=await api("/api/shops");}catch(e){state.shops=[];}state.shop=state.shops[0]||null;}
  render();
}
function render(){
  const app=document.getElementById("app");app.innerHTML="";
  const isAdmin=state.user&&state.user.is_platform_admin;
  const tabs=[["products","🧦","Sản phẩm"],["knowledge","📚","Kiến thức"],["channels","🔌","Kênh & Widget"],
    ["inbox","💬","Hộp thư"],["usage","📊","Sử dụng"],["plan","💳","Gói"],["settings","⚙️","Cài đặt AI"]];
  if(isAdmin)tabs.push(["admin","🛡️","Quản trị nền tảng"]);
  const side=el("div",{class:"side"},el("div",{class:"brand"},"🛍️ OmniShop",el("small",{}," AI")),
    ...tabs.map(([t,ic,lb])=>el("div",{class:"nav "+(state.tab===t?"active":""),on:{click:()=>{state.tab=t;saveAuth();render();}}},el("span",{class:"ic"},ic),lb)));
  const orgSel=el("select",{on:{change:async e=>{state.org=state.orgs.find(o=>o.id===e.target.value);saveAuth();state.shops=await api("/api/shops");state.shop=state.shops[0]||null;render();}}},
    ...state.orgs.map(o=>el("option",{value:o.id,selected:state.org&&o.id===state.org.id},o.name)));
  const shopSel=el("select",{on:{change:e=>{state.shop=state.shops.find(s=>s.id===e.target.value);render();}}},
    ...state.shops.map(s=>el("option",{value:s.id,selected:state.shop&&s.id===state.shop.id},s.name)),...(state.shops.length?[]:[el("option",{},"(chưa có shop)")]));
  const top=el("div",{class:"topbar"},el("span",{class:"muted"},"Org"),orgSel,el("span",{class:"muted"},"Shop"),shopSel,
    el("span",{style:"flex:1"}),el("span",{class:"muted",style:"font-size:13px"},state.user?state.user.email:""),
    el("button",{class:"ghost",on:{click:()=>{state.token=null;saveAuth();authView();}}},"Đăng xuất"));
  const content=el("div",{class:"content",id:"content"});
  const main=el("div",{class:"main"},top,content);
  app.appendChild(el("div",{class:"shell"},side,main));
  const needShop=!state.shop&&!["plan","settings","admin"].includes(state.tab);
  if(needShop){content.appendChild(shopSetup());return;}
  ({products:tabProducts,knowledge:tabKnowledge,channels:tabChannels,inbox:tabInbox,usage:tabUsage,plan:tabPlan,settings:tabSettings,admin:tabAdmin}[state.tab])(content);
}
function shopSetup(){
  const name=el("input",{placeholder:"Tên cửa hàng"}),err=el("div",{class:"err"});
  return el("div",{class:"card"},el("h3",{},"Tạo cửa hàng đầu tiên"),el("p",{class:"sub"},"Bạn cần một cửa hàng để thêm sản phẩm, kiến thức và bật chatbot."),
    el("label",{},"Tên cửa hàng"),name,el("div",{style:"margin-top:12px"},el("button",{on:{click:async()=>{try{await api("/api/shops",{method:"POST",body:JSON.stringify({name:name.value||"Cửa hàng của tôi"})});state.shops=await api("/api/shops");state.shop=state.shops[0];render();}catch(e){err.textContent=e.message;}}}},"Tạo cửa hàng")),err);
}

// ---------- products ----------
async function tabProducts(c){
  const list=el("div",{},el("p",{class:"muted"},"Đang tải…"));
  const name=el("input",{placeholder:"Tên sản phẩm"}),price=el("input",{type:"number",placeholder:"Giá (VND)"}),desc=el("textarea",{placeholder:"Mô tả",style:"min-height:70px"}),variants=el("input",{placeholder:"Biến thể: Size M:10, Size L:3"}),err=el("div",{class:"err"});
  const add=async()=>{err.textContent="";const vs=(variants.value||"").split(",").map(s=>s.trim()).filter(Boolean).map(s=>{const[n,st]=s.split(":");return{name:(n||"").trim(),stock:parseInt(st||"0")||0};});
    try{await api("/api/products",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,name:name.value,price:price.value?parseFloat(price.value):null,description:desc.value,variants:vs})});name.value=price.value=desc.value=variants.value="";load();}catch(e){err.textContent=e.message;}};
  const load=async()=>{try{const ps=await api("/api/products?shop_id="+state.shop.id);list.innerHTML="";
    if(!ps.length){list.appendChild(el("p",{class:"muted"},"Chưa có sản phẩm."));return;}
    const t=el("table",{},el("tr",{},el("th",{},"Tên"),el("th",{},"Giá"),el("th",{},"Biến thể / tồn kho")));
    ps.forEach(p=>t.appendChild(el("tr",{},el("td",{},el("strong",{},p.name),el("div",{class:"muted",style:"font-size:12px"},(p.description||"").slice(0,60))),el("td",{},p.price!=null?p.price.toLocaleString()+" "+p.currency:"—"),el("td",{},(p.variants||[]).map(v=>el("span",{class:"tag"},v.name+" · "+v.stock))))));
    list.appendChild(t);}catch(e){list.innerHTML="";list.appendChild(el("div",{class:"err"},e.message));}};
  c.appendChild(el("div",{class:"card"},el("h3",{},"Thêm sản phẩm"),el("p",{class:"sub"},"AI sẽ dùng dữ liệu này để trả lời về giá, tồn kho, biến thể."),
    el("label",{},"Tên"),name,el("div",{class:"grid2"},el("div",{},el("label",{},"Giá"),price),el("div",{},el("label",{},"Biến thể / tồn kho"),variants)),el("label",{},"Mô tả"),desc,
    el("div",{style:"margin-top:12px"},el("button",{on:{click:add}},"💾 Lưu sản phẩm")),err));
  c.appendChild(el("div",{class:"card"},el("h3",{},"Danh sách sản phẩm"),list));load();

// ---------- knowledge ----------
async function tabKnowledge(c){
  const list=el("div",{},el("p",{class:"muted"},"Đang tải…"));
  const title=el("input",{placeholder:"Tiêu đề (vd: Chính sách đổi trả)"}),text=el("textarea",{placeholder:"Dán nội dung…",style:"min-height:110px"}),err=el("div",{class:"err"}),ok=el("div",{class:"okmsg"});
  const addText=async()=>{err.textContent="";ok.textContent="";try{await api("/api/knowledge/documents",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,title:title.value,text:text.value})});title.value=text.value="";ok.textContent="Đã thêm, đang tạo embedding…";load();}catch(e){err.textContent=e.message;}};

  const load=async()=>{try{const ds=await api("/api/knowledge/documents?shop_id="+state.shop.id);list.innerHTML="";
    if(!ds.length){list.appendChild(el("p",{class:"muted"},"Chưa có tài liệu."));return;}
    const t=el("table",{},el("tr",{},el("th",{},"Tiêu đề"),el("th",{},"Nguồn"),el("th",{},"Trạng thái"),el("th",{},"Đoạn")));
    ds.forEach(d=>t.appendChild(el("tr",{},el("td",{},d.title),el("td",{class:"muted"},d.source||"text"),el("td",{},el("span",{class:"pill "+d.status},d.status)),el("td",{},String(d.chunks)))));

  }catch(e){list.innerHTML="";list.appendChild(el("div",{class:"err"},e.message));}};
  c.appendChild(el("div",{class:"card"},el("h3",{},"Tải tài liệu"),el("p",{class:"sub"},"Nhập text hoặc tải file. Nội dung được cắt đoạn và tạo embedding (chạy nền)."),
    drop,fileInput,el("div",{style:"height:12px"}),el("label",{},"Hoặc nhập tiêu đề + nội dung"),title,el("div",{style:"height:8px"}),text,
    el("div",{style:"margin-top:12px"},el("button",{on:{click:addText}},"➕ Thêm text")),ok,err));
  c.appendChild(el("div",{class:"card"},el("h3",{},"Tài liệu"),list));load();
}

// ---------- channels ----------
async function tabChannels(c){
  const list=el("div",{},el("p",{class:"muted"},"Đang tải…")),err=el("div",{class:"err"});
  const create=async()=>{err.textContent="";try{await api("/api/channels",{method:"POST",body:JSON.stringify({shop_id:state.shop.id,kind:"website",name:"Website widget"})});load();}catch(e){err.textContent=e.message;}};

// ---------- inbox ----------
async function tabInbox(c){
  const wrap=el("div",{class:"row top"}),left=el("div",{style:"flex:1;min-width:240px"}),right=el("div",{style:"flex:1.4;min-width:280px"},el("p",{class:"muted"},"Chọn một hội thoại."));

      el("div",{class:"row",style:"margin-top:10px"},el("div",{style:"flex:1"},inp),el("button",{on:{click:send}},"Gửi"),el("button",{class:"sec",on:{click:async()=>{await api("/api/conversations/"+cv.id+"/close",{method:"POST"});loadList();}}},"Đóng"))));

// ---------- usage ----------

function llmForm(cfg,providers,onSave,onTest,onDelete){
  const prov=el("select",{},...providers.map((p,i)=>el("option",{value:i},p.label)));
  const model=el("input",{placeholder:"model (vd: claude-opus-5, gpt-4o-mini, gemini-1.5-flash)"});
  const base=el("input",{placeholder:"base_url (để trống nếu mặc định)"});
  const key=el("input",{type:"password",placeholder:"API key (để trống = giữ nguyên)"});
  const maxt=el("input",{type:"number",placeholder:"max_tokens (mặc định 1024)"});
  const err=el("div",{class:"err"}),ok=el("div",{class:"okmsg"});
  if(cfg){model.value=cfg.model||"";base.value=cfg.base_url||"";
    const idx=providers.findIndex(p=>p.id===cfg.provider&&(!p.base_url||p.base_url===cfg.base_url));prov.value=idx>=0?idx:providers.findIndex(p=>p.id===cfg.provider);}
  prov.addEventListener("change",()=>{const p=providers[prov.value];if(p&&p.base_url&&!base.value)base.value=p.base_url;});
  const body=()=>({provider:providers[prov.value].id,model:model.value,base_url:base.value,api_key:key.value?key.value:null,max_tokens:maxt.value?parseInt(maxt.value):null});
  return el("div",{},el("label",{},"Nhà cung cấp"),prov,el("div",{class:"grid2"},el("div",{},el("label",{},"Model"),model),el("div",{},el("label",{},"Base URL"),base)),
    el("div",{class:"grid2"},el("div",{},el("label",{},"API key"),key),el("div",{},el("label",{},"Max tokens"),maxt)),
    el("div",{class:"row",style:"margin-top:12px"},
      el("button",{on:{click:async()=>{ok.textContent="Đang test…";err.textContent="";try{const r=await onTest(body());if(r.ok){ok.textContent="✅ OK ("+(r.model||r.dim||"")+"): "+(r.reply||"");}else{err.textContent="❌ "+r.error;ok.textContent="";}}catch(e){err.textContent=e.message;ok.textContent="";}}}},"🔌 Test"),
      el("button",{class:"sec",on:{click:async()=>{err.textContent="";ok.textContent="";try{await onSave(body());ok.textContent="Đã lưu.";}catch(e){err.textContent=e.message;}}}},"💾 Lưu"),
      onDelete?el("button",{class:"danger",on:{click:async()=>{try{await onDelete();ok.textContent="Đã xoá cấu hình riêng, dùng mặc định nền tảng.";}catch(e){err.textContent=e.message;}}}},"Xoá override"):null),
    ok,err);
