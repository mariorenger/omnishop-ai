<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chat</title>
<style>
  :root{--accent:#6366f1}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Be Vietnam Pro",system-ui,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#0f172a;height:100vh;display:flex;flex-direction:column}
  header{background:var(--accent);color:#fff;padding:12px 16px;font-weight:600;display:flex;align-items:center;gap:10px}
  header img{width:32px;height:32px;border-radius:9px;object-fit:cover;background:rgba(255,255,255,.2)}
  header .av{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
  header .t{line-height:1.1}
  header .t small{display:block;font-weight:400;font-size:11px;opacity:.85}
  #log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .b{padding:9px 12px;border-radius:14px;max-width:82%;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .bot{background:#fff;border:1px solid #e6e8f0;align-self:flex-start;border-bottom-left-radius:4px}
  .sys{background:#fef3c7;border:1px solid #fde68a;align-self:center;font-size:12px}
  form{display:flex;gap:8px;padding:10px;border-top:1px solid #e6e8f0;background:#fff}
  input{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
  button{padding:10px 14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .typing{color:#94a3b8;font-size:12px;padding:2px 14px}
</style>
</head>
<body>
<header id="hd"><span class="av" id="av">🤖</span><span class="t"><span id="title">Trợ lý</span><small>Trực tuyến</small></span></header>
<div id="log"></div>
<div class="typing" id="typing" style="display:none">Đang soạn trả lời…</div>
<form id="f"><input id="t" placeholder="Nhập tin nhắn…" autocomplete="off"/><button>Gửi</button></form>
<script>
const key = new URLSearchParams(location.search).get("key");
const log = document.getElementById("log");
const SID_KEY = "omni_sid_"+key;
let sid = localStorage.getItem(SID_KEY);
if(!sid){ sid = "s_"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(SID_KEY, sid); }
let lastAt = "";
function bubble(text, cls){ const d=document.createElement("div"); d.className="b "+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; }
async function init(){
  if(!key){ bubble("Thiếu khóa widget (?key=...)","sys"); return; }
  try{
    const c = await (await fetch("/api/widget/"+key+"/config")).json();
    if(c.accent_color) document.documentElement.style.setProperty("--accent", c.accent_color);
    if(c.name) document.getElementById("title").textContent = c.name;
    if(c.avatar_url){ const av=document.getElementById("av"); av.outerHTML = '<img id="av" src="'+c.avatar_url+'"/>'; }
    if(c.greeting) bubble(c.greeting, "bot");
  }catch(e){ bubble("Không tải được cấu hình widget.","sys"); }
  poll(); setInterval(poll, 4000);
}
async function poll(){
  try{
    const url="/api/widget/"+key+"/poll?session_id="+encodeURIComponent(sid)+(lastAt?("&after="+encodeURIComponent(lastAt)):"");
    const d=await (await fetch(url)).json();
    (d.messages||[]).forEach(m=>{ if(m.role==="agent") bubble(m.content,"bot"); else if(m.role==="system") bubble(m.content,"sys"); lastAt=m.at; });
  }catch(e){}
}
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const inp=document.getElementById("t"); const text=inp.value.trim(); if(!text) return;
  inp.value=""; bubble(text,"me"); document.getElementById("typing").style.display="block";
  try{
    const r=await fetch("/api/widget/"+key+"/message",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sid,text})});
    const d=await r.json(); bubble(d.reply, d.status==="needs_human"?"sys":"bot"); lastAt=new Date().toISOString();
  }catch(err){ bubble("Có lỗi xảy ra, vui lòng thử lại.","sys"); }
  document.getElementById("typing").style.display="none";
});
init();
</script>
</body>
</html>
