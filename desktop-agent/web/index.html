<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desktop Agent</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--bd:#e5e7eb;--side:#f6f7f9;--acc:#2563eb;--usr:#e8f0fe;--code:#f3f4f6;--warn:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e6e6;--mut:#9aa0aa;--bd:#2c3038;--side:#1d2025;--acc:#5b8def;--usr:#22324f;--code:#23272e;--warn:#3a3220}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;font:14px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--fg)}
#side{width:270px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-width:0}
#side h3{margin:0;padding:12px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#proj{padding:0 12px 12px;border-bottom:1px solid var(--bd)}
#projname{font-weight:600;word-break:break-all;margin-bottom:6px}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:5px 10px;border-radius:6px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}
#tree{flex:1;overflow:auto;padding:4px 6px;font-size:13px}
.n{padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n:hover{background:var(--bd)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);color:var(--mut);font-size:12px}
#bar .sp{flex:1}
#log{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:820px;white-space:pre-wrap;word-break:break-word;padding:8px 12px;border-radius:10px}
.u{align-self:flex-end;background:var(--usr)}.a{align-self:flex-start;border:1px solid var(--bd)}
.t{align-self:flex-start;max-width:820px;width:100%;font-size:12px;border:1px solid var(--bd);border-radius:8px;background:var(--code)}
.t summary{cursor:pointer;padding:5px 10px;color:var(--mut)}.t pre{margin:0;padding:8px 10px;overflow:auto;max-height:260px;white-space:pre-wrap;border-top:1px solid var(--bd)}
.ap{align-self:flex-start;max-width:820px;background:var(--warn);border:1px solid var(--bd);border-radius:8px;padding:8px 12px}
.ap pre{margin:6px 0;white-space:pre-wrap;max-height:200px;overflow:auto;font-size:12px}.ap button{margin-right:6px}
.err{color:#dc2626}
#in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--bd)}
textarea{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);resize:none;height:56px}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}
#box{background:var(--bg);width:min(560px,92vw);max-height:80vh;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
#list{overflow:auto;border:1px solid var(--bd);border-radius:6px;min-height:200px}
#cur{font-size:12px;color:var(--mut);word-break:break-all}
#viewer{display:none;position:fixed;right:0;top:0;bottom:0;width:min(560px,60vw);background:var(--bg);border-left:1px solid var(--bd);flex-direction:column}
#viewer pre{margin:0;padding:12px;overflow:auto;flex:1;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="side">
  <h3>Project</h3>
  <div id="proj"><div id="projname">Chưa chọn</div><button class="p" id="pick">Chọn thư mục…</button></div>
  <h3>Files</h3><div id="tree"></div>
</div>
<div id="main">
  <div id="bar"><span id="model"></span><span class="sp"></span>
    <label><input type="checkbox" id="auto"> Tự duyệt ghi file / chạy lệnh</label>
    <button id="reset">Cuộc trò chuyện mới</button></div>
  <div id="log"></div>
  <div id="in"><textarea id="msg" placeholder="Nhập yêu cầu… (Enter gửi, Shift+Enter xuống dòng)"></textarea>
    <button class="p" id="send">Gửi</button><button id="stop" style="display:none">Dừng</button></div>
</div>
<div id="viewer"><div style="display:flex;padding:8px 12px;border-bottom:1px solid var(--bd)"><b id="vname" style="flex:1"></b><button id="vclose">×</button></div><pre id="vbody"></pre></div>
<div id="modal"><div id="box"><b>Chọn thư mục project</b><div id="cur"></div><div id="list"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button id="mcancel">Huỷ</button><button class="p" id="mok">Chọn thư mục này</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const T=new URLSearchParams(location.search).get('t')||sessionStorage.t||'';
if(T){sessionStorage.t=T;history.replaceState(null,'',location.pathname)}
const api=(p,o={})=>fetch(p,{...o,headers:{'X-Token':T,'Content-Type':'application/json'}});
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
let ctl=null,browsePath='';

async function state(){const s=await(await api('/api/state')).json();
  $('model').textContent=s.model+' · '+s.base_url;$('auto').checked=s.auto;setProject(s.project)}
function setProject(p){$('projname').textContent=p||'Chưa chọn';$('tree').innerHTML='';if(p)loadTree('.',$('tree'),0)}
async function loadTree(path,el,depth){
  const r=await api('/api/tree?path='+encodeURIComponent(path));if(!r.ok)return;
  for(const e of (await r.json()).entries){
    const rel=path==='.'?e.name:path+'/'+e.name;
    const d=document.createElement('div');d.className='n';d.style.paddingLeft=(6+depth*14)+'px';
    d.textContent=(e.dir?'▸ ':'· ')+e.name;el.appendChild(d);
    if(e.dir){let open=false,box=document.createElement('div');el.appendChild(box);
      d.onclick=async()=>{open=!open;d.textContent=(open?'▾ ':'▸ ')+e.name;box.innerHTML='';if(open)await loadTree(rel,box,depth+1)}}
    else d.onclick=()=>viewFile(rel)}}
async function viewFile(p){const r=await(await api('/api/file?path='+encodeURIComponent(p))).json();
  $('vname').textContent=p;$('vbody').textContent=r.content;$('viewer').style.display='flex'}
$('vclose').onclick=()=>$('viewer').style.display='none';

// folder picker
async function browse(p){const r=await api('/api/browse?path='+encodeURIComponent(p||''));
  if(!r.ok){alert(await r.text());return}const j=await r.json();browsePath=j.path;$('cur').textContent=j.path;
  const l=$('list');l.innerHTML='';
  const add=(t,pp)=>{const d=document.createElement('div');d.className='n';d.textContent=t;d.onclick=()=>browse(pp);l.appendChild(d)};
  if(j.parent)add('⬆ ..',j.parent);(j.drives||[]).forEach(d=>add('💽 '+d,d));j.dirs.forEach(e=>add('📁 '+e.name,j.path+(j.path.endsWith('/')||j.path.endsWith('\\')?'':(j.path.includes('\\')?'\\':'/'))+e.name))}
$('pick').onclick=()=>{$('modal').style.display='flex';browse('')};
$('mcancel').onclick=()=>$('modal').style.display='none';
$('mok').onclick=async()=>{const r=await post('/api/project',{path:browsePath});
  if(r.ok){$('modal').style.display='none';$('log').innerHTML='';setProject((await r.json()).project)}else alert(await r.text())};

// chat
function add(cls,text){const d=document.createElement('div');d.className=cls;d.textContent=text;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
const calls={};
function toolBox(id,name,args){const d=document.createElement('details');d.className='t';
  let a=args;try{const o=JSON.parse(args);a=Object.entries(o).map(([k,v])=>k+': '+v).join('\n')}catch{}
  d.innerHTML='<summary></summary><pre></pre>';
  let brief='';try{const o=JSON.parse(args);brief=o.path||o.command||o.pattern||''}catch{}
  d.querySelector('summary').textContent='🔧 '+name+' '+brief;d.querySelector('pre').textContent=a;
  $('log').appendChild(d);calls[id]=d;$('log').scrollTop=1e9}
function approval(c){const d=document.createElement('div');d.className='ap';
  let a=c.args;try{const o=JSON.parse(c.args);a=Object.entries(o).map(([k,v])=>k+': '+v).join('\n')}catch{}
  d.innerHTML='<b></b><pre></pre><button class="p">Cho phép</button><button>Từ chối</button><button>Luôn cho phép</button>';
  d.querySelector('b').textContent='Agent muốn chạy: '+c.name;d.querySelector('pre').textContent=a;
  const [y,n,al]=d.querySelectorAll('button');
  const done=(allow,always)=>{post('/api/approve',{id:c.id,allow,always});d.remove();if(always)$('auto').checked=true};
  y.onclick=()=>done(true);n.onclick=()=>done(false);al.onclick=()=>done(true,true);
  $('log').appendChild(d);$('log').scrollTop=1e9}
function onEvent(e){const d=e.data;
  if(e.event==='assistant')add('m a',d);
  else if(e.event==='tool_call')toolBox(d.id,d.name,d.args);
  else if(e.event==='tool_result'){const b=calls[d.id];if(b){const p=document.createElement('pre');p.textContent=d.result;b.appendChild(p)}
    if(b&&/^(write|edit)/.test(b.querySelector('summary').textContent.slice(3)))loadTreeRoot()}
  else if(e.event==='approval')approval(d);
  else if(e.event==='error')add('m a err','⚠ '+d)}
function loadTreeRoot(){$('tree').innerHTML='';loadTree('.',$('tree'),0)}
async function send(){const t=$('msg').value.trim();if(!t||ctl)return;$('msg').value='';add('m u',t);
  ctl=new AbortController();$('send').style.display='none';$('stop').style.display='';
  try{const r=await fetch('/api/chat',{method:'POST',signal:ctl.signal,headers:{'X-Token':T,'Content-Type':'application/json'},body:JSON.stringify({message:t})});
    if(!r.ok){add('m a err',await r.text())}else{
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const ch=buf.slice(0,i);buf=buf.slice(i+2);
        if(ch.startsWith('data: '))onEvent(JSON.parse(ch.slice(6)))}}}}
  catch(e){if(e.name!=='AbortError')add('m a err','⚠ '+e)}
  ctl=null;$('send').style.display='';$('stop').style.display='none';$('msg').focus()}
$('send').onclick=send;$('stop').onclick=()=>ctl&&ctl.abort();
$('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('reset').onclick=async()=>{await post('/api/reset',{});$('log').innerHTML=''};
$('auto').onchange=e=>post('/api/auto',{on:e.target.checked});
state();
</script>
</body>
</html>
